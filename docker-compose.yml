services:
    nginx:
        container_name: app_ooo_nginx
        build:
            context: ./
            dockerfile: docker/nginx/Dockerfile
            target: local
        ports:
            - "80:80"
        environment:
            PHP_HOST: app_ooo_php
        volumes:
            - ./app:/var/www
        depends_on:
            - php

    php:
        container_name: app_ooo_php
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: local
        environment:
            PHP_IDE_CONFIG: 'serverName=php_ooo'
            MARIADB_TLS_DISABLE_PEER_VERIFICATION: 1
        volumes:
            - ./app:/var/www
            - ./docker/php/conf/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
            - ./docker/php/conf/php.local.ini:/usr/local/etc/php/conf.d/docker-php-local.ini

    worker-async:
        container_name: app_ooo_worker_async
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: local
        command: start-worker async
        restart: unless-stopped
        environment:
            MARIADB_TLS_DISABLE_PEER_VERIFICATION: 1
            WORKER_TIME_LIMIT: 3600
        volumes:
            - ./app:/var/www
        depends_on:
            - php
            - db

    worker-scheduler:
        container_name: app_ooo_worker_scheduler
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: local
        command: start-worker scheduler_default scheduler_weekly_digest
        restart: unless-stopped
        environment:
            MARIADB_TLS_DISABLE_PEER_VERIFICATION: 1
        volumes:
            - ./app:/var/www
        depends_on:
            - php
            - db

    db:
        image: mysql:8.4.4
        platform: linux/amd64
        container_name: app_ooo_db
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: ooo_db
            MYSQL_USER: mysql
            MYSQL_PASSWORD: mysql
        ports:
            - "3306:3306"
        volumes:
            - mysql:/var/lib/mysql:delegated
            - ./docker/mysql/init-grants.sql:/docker-entrypoint-initdb.d/init-grants.sql

    mailer:
        image: axllent/mailpit
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
volumes:
    mysql:
