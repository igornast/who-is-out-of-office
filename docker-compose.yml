services:
    nginx:
        container_name: app_ooo_nginx
        build:
            context: ./
            dockerfile: docker/nginx/Dockerfile
            target: local
        ports:
            - "80:80"
        environment:
            PHP_HOST: app_ooo_php
        volumes:
            - ./app:/var/www
        depends_on:
            - php

    php:
        container_name: app_ooo_php
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: local
        environment:
            PHP_IDE_CONFIG: 'serverName=php_ooo'
            MARIADB_TLS_DISABLE_PEER_VERIFICATION: 1
        volumes:
            - ./app:/var/www
            - ./docker/php/conf/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
            - ./docker/php/conf/php.local.ini:/usr/local/etc/php/conf.d/docker-php-local.ini

    # One process for every transport, polled in the order given, so the schedulers are checked between async messages.
    # No time limit: schedules keep no state, so a restart can skip a job that fell due while the worker was down.
    # Never run a second copy: each copy would dispatch every scheduled job.
    worker:
        container_name: app_ooo_worker
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            target: local
        command: start-worker scheduler_default scheduler_weekly_digest async
        restart: unless-stopped
        environment:
            MARIADB_TLS_DISABLE_PEER_VERIFICATION: 1
        volumes:
            - ./app:/var/www
        depends_on:
            - php
            - db

    db:
        image: mysql:8.4.4
        platform: linux/amd64
        container_name: app_ooo_db
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: ooo_db
            MYSQL_USER: mysql
            MYSQL_PASSWORD: mysql
        ports:
            - "3306:3306"
        volumes:
            - mysql:/var/lib/mysql:delegated
            - ./docker/mysql/init-grants.sql:/docker-entrypoint-initdb.d/init-grants.sql

    mailer:
        image: axllent/mailpit
        ports:
            - "1025:1025"
            - "8025:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
volumes:
    mysql:
