security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'argon2id'
    providers:
        app_user_provider:
            entity:
                class: App\Infrastructure\Doctrine\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: /app/dashboard
                always_use_default_target_path: true
                remember_me_sets_trusted: false
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: two_factor
            logout:
                path: /logout
                target: app_login

    access_control:
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/app, roles: ROLE_USER }
        - { path: ^/fc-load-events, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
